[workspace]
resolver = "3"
members = ["crates/*", "bins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MSRV di alloy 2.x (la dipendenza con il requisito più alto).
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DanieleMarino70/Sedette"
publish = false

[workspace.dependencies]
# Crate interni
sedette-analytics = { path = "crates/analytics" }
sedette-backtest = { path = "crates/backtest" }
sedette-chain = { path = "crates/chain" }
sedette-config = { path = "crates/config" }
sedette-datasource = { path = "crates/datasource" }
sedette-ingest = { path = "crates/ingest" }
sedette-markets = { path = "crates/markets" }
sedette-paper = { path = "crates/paper" }
sedette-positions = { path = "crates/positions" }
sedette-signals = { path = "crates/signals" }
sedette-storage = { path = "crates/storage" }
sedette-types = { path = "crates/types" }

# Dipendenze esterne. Quelle non previste dalla specifica sono motivate in
# docs/adr/ e nella PR che le introduce.
# Lettura della chain in sola lettura. Niente feature predefinite: includerebbero
# `signer-local` (firma con chiavi private), vietato dalla specifica.
alloy = { version = "2.5.0", default-features = false, features = [
    "std",
    "reqwest",
    "reqwest-rustls-tls",
    "provider-http",
    "provider-ws",
    "rpc-types",
] }
# Tipi primitivi EVM (B256, U256, Address): parte di alloy, compatibile con alloy 2.x.
alloy-primitives = "1.7.3"
anyhow = "1.0.104"
config = { version = "0.15.27", default-features = false, features = ["toml"] }
# Carica il file .env locale nei binari, senza modificare l'ambiente del processo.
dotenvy = "0.15.7"
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
debug = "line-tables-only"
